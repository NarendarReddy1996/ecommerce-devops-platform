apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ecommerce
data:
  LOG_LEVEL: "info"
  NODE_ENV: "production"
  API_TIMEOUT: "30000"
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: ecommerce
type: Opaque
stringData:
  connection-string: "mongodb://mongodb-service:27017/products"
  username: "admin"
  password: "change-me-in-production"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: ecommerce
type: Opaque
stringData:
  connection-string: "postgresql://postgres:5432/users"
  username: "postgres"
  password: "change-me-in-production"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: ecommerce
type: Opaque
stringData:
  connection-string: "redis://redis-service:6379"
  password: "change-me-in-production"
